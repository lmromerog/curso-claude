openapi: 3.0.3
info:
  title: Resttek API
  version: 1.0.0
  description: |
    API REST de la plataforma de gestión de restaurantes Resttek.

    ## Autenticación
    Los endpoints protegidos requieren una cabecera `Authorization: Bearer <token>`.
    El token (JWT, válido 8 horas) se obtiene en `POST /auth/login` o `POST /auth/register`
    y contiene `{id, role, restaurantId}`.

    ## Roles
    `admin`, `manager`, `camarero`, `cocinero` y `cliente`. Los clientes son registros de
    empleados con rol `cliente`.

    ## Errores
    Los errores de dominio responden `{ "error": "<NombreDelError>", "message": "<detalle>" }`
    (400 por defecto, 401 para credenciales inválidas, 404 para recursos inexistentes).
    Los fallos de autenticación/autorización y los endpoints de pedidos responden solo
    `{ "error": "<detalle>" }`.
servers:
  - url: /api/v1
    description: Servidor de la API (el puerto por defecto es 3000)
tags:
  - name: Health
    description: Estado del servicio
  - name: Auth
    description: Inicio de sesión y registro de clientes
  - name: Employees
    description: Gestión de empleados (solo admin)
  - name: Restaurants
    description: Restaurantes
  - name: Ingredients
    description: Ingredientes de un restaurante
  - name: Dishes
    description: Platos de un restaurante
  - name: Orders
    description: Pedidos y estado de sus líneas
  - name: Public
    description: Endpoints sin autenticación para la carta de clientes
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en `/auth/login` o `/auth/register`.
  responses:
    Unauthorized:
      description: Token ausente, mal formado o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Unauthorized: No token provided'
    Forbidden:
      description: El rol del usuario no tiene permiso para este endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Forbidden: Insufficient permissions'
    DomainError:
      description: Error de validación o de dominio (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
    NotFound:
      description: El recurso no existe (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
  schemas:
    DomainError:
      type: object
      description: Error de dominio gestionado por `errorHandler`.
      required: [error, message]
      properties:
        error:
          type: string
          description: Nombre de la clase de error.
          example: InvalidCredentialsError
        message:
          type: string
          example: Invalid credentials
    SimpleError:
      type: object
      description: Error con un único campo de texto (middlewares de auth y endpoints de pedidos).
      required: [error]
      properties:
        error:
          type: string
          example: Internal Server Error
    Role:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]
    Employee:
      type: object
      required: [id, firstName, lastName, email, role, restaurantId]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          nullable: true
          description: Restaurante al que pertenece; `null` para admin y clientes.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@resttek.com
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [token, employee]
      properties:
        token:
          type: string
          description: JWT válido durante 8 horas.
        employee:
          $ref: '#/components/schemas/Employee'
    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          nullable: true
    RestaurantInput:
      type: object
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: string
          nullable: true
    Restaurant:
      allOf:
        - $ref: '#/components/schemas/RestaurantInput'
        - type: object
          required: [id, logoUrl, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            logoUrl:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
    IngredientCreateRequest:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
          default: 0
    IngredientUpdateRequest:
      type: object
      required: [name, unit, currentStock]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
    Ingredient:
      type: object
      required: [id, name, unit, currentStock, restaurantId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
        restaurantId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
    DishIngredient:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId:
          type: string
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
    DishRequest:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Debe ser un número positivo.
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
          description: Por defecto `true` al crear.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
    Dish:
      type: object
      required: [id, name, description, price, category, available, restaurantId, ingredients, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
        restaurantId:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
      description: Flujo `pendiente → preparando → listo → entregado`.
    OrderItem:
      type: object
      description: Cada línea representa una unidad (`quantity` es siempre 1).
      required: [id, dishId, quantity, notes, status]
      properties:
        id:
          type: string
          format: uuid
        dishId:
          type: string
        quantity:
          type: integer
          example: 1
        notes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        dishName:
          type: string
          description: Solo presente al consultar pedidos.
        dishPrice:
          type: number
          description: Solo presente al consultar pedidos.
        dishCategory:
          type: string
          description: Solo presente al consultar pedidos.
    Order:
      type: object
      required: [id, restaurantId, tableId, clientId, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
        tableId:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true
          description: Id del usuario autenticado que creó el pedido.
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        restaurantName:
          type: string
          description: Solo presente al consultar pedidos.
        restaurantLogoUrl:
          type: string
          nullable: true
          description: Solo presente al consultar pedidos.
    CreateOrderRequest:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
        tableId:
          type: string
          nullable: true
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
              quantity:
                type: integer
                minimum: 1
                description: Se expande en `quantity` líneas de cantidad 1.
              notes:
                type: string
                nullable: true
    UpdateItemStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
paths:
  /health:
    get:
      tags: [Health]
      summary: Comprobar el estado del servicio
      description: Se sirve en `/health`, fuera del prefijo `/api/v1`.
      servers:
        - url: /
      responses:
        '200':
          description: El servicio está activo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales correctas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: InvalidCredentialsError
                message: Invalid credentials
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un cliente
      description: Crea un usuario con rol `cliente` y devuelve su token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cliente creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Datos inválidos o email ya registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: DuplicatedEmailError
                message: Email is already in use
  /employees:
    post:
      tags: [Employees]
      summary: Crear un empleado
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Empleado creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Employees]
      summary: Listar empleados con paginación
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: role
          in: query
          description: Filtra por rol.
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Lista de empleados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /employees/{id}:
    get:
      tags: [Employees]
      summary: Obtener un empleado
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Empleado encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{restaurantId}/employees:
    get:
      tags: [Employees]
      summary: Listar los empleados de un restaurante
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Empleados del restaurante.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants:
    post:
      tags: [Restaurants]
      summary: Crear un restaurante
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '201':
          description: Restaurante creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Restaurants]
      summary: Listar restaurantes
      description: |
        Cualquier usuario autenticado. Un `admin` recibe todos los restaurantes; el resto
        solo el suyo (lista vacía si no tiene `restaurantId`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de restaurantes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /restaurants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Restaurants]
      summary: Obtener un restaurante
      description: Cualquier usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Restaurante encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Restaurants]
      summary: Actualizar un restaurante
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '200':
          description: Restaurante actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/restaurants:
    get:
      tags: [Public]
      summary: Listar todos los restaurantes (sin autenticación)
      responses:
        '200':
          description: Lista de restaurantes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
  /public/restaurants/{id}:
    get:
      tags: [Public]
      summary: Obtener un restaurante (sin autenticación)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Restaurante encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{restaurantId}/ingredients:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Ingredients]
      summary: Crear un ingrediente
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientCreateRequest'
      responses:
        '201':
          description: Ingrediente creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          description: Datos inválidos (nombre vacío, unidad no válida, stock negativo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: InvalidUnitError
                message: 'Invalid unit: litro. Must be one of: kg, g, l, ml, unidad'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Ingredients]
      summary: Listar los ingredientes de un restaurante
      description: 'Roles permitidos: `admin`, `manager`, `cocinero`.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de ingredientes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{restaurantId}/ingredients/{id}:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Ingredients]
      summary: Obtener un ingrediente
      description: 'Roles permitidos: `admin`, `manager`, `cocinero`.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ingrediente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ingredients]
      summary: Actualizar un ingrediente
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientUpdateRequest'
      responses:
        '200':
          description: Ingrediente actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Ingredients]
      summary: Eliminar un ingrediente
      description: 'Roles permitidos: `admin`.'
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Ingrediente eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
